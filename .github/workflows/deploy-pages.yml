name: Desplegar Calendario Perpetuo (JS) en GitHub Pages

# Publica dos versiones en subcarpetas dentro de GitHub Pages:
#   - CalendarioPerpetuoFlipJS/     -> /flip/
#   - CalendarioPerpetuoFlipJS935/  -> /flip935/
# usando el flujo oficial de Actions (sin rama gh-pages ni ficheros intermedios).

on:
  push:
    branches: [main]
    paths:
      - 'CalendarioPerpetuoFlipJS/**'
      - 'CalendarioPerpetuoFlipJS935/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar carpeta de publicacion (flip/ y flip935/)
        run: |
          mkdir -p _site/flip
          mkdir -p _site/flip935
          cp -r CalendarioPerpetuoFlipJS/. _site/flip/
          cp -r CalendarioPerpetuoFlipJS935/. _site/flip935/
          touch _site/.nojekyll

      - name: Subir _site/ como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
